
name: Build DeS Sea Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f "build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "des-sea/build.gradle.kts" ]; then
            echo "dir=des-sea" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

      - name: Build plugin
        run: gradle -p "${{ steps.project.outputs.dir }}" clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeSSea-Plugin
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          
