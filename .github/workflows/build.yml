
name: Build DeS Sea Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o des-sea-levi-plugin-files.zip -d .
          test -f des-sea/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle -p des-sea clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeSSea-Plugin
          path: des-sea/build/libs/*.jar
          if-no-files-found: error
          
